<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>IT Asset & Phone Directory</title>
<link rel="icon" href="1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Noto Sans Thai', 'sans-serif'], mono: ['IBM Plex Mono', 'monospace'] },
        colors: {
          ink: '#0B1B2B',
          slate: { 950: '#0A1420' },
          teal: { 650: '#0C7C74' }
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Noto Sans Thai', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .tab-btn.active { color: #0C7C74; border-color: #0C7C74; }
  .fade-in { animation: fadeIn .15s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
  input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px #0C7C74; }
</style>
</head>
<body class="bg-slate-50 text-ink min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-ink text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-lg bg-teal-650 flex items-center justify-center shrink-0 mono font-bold text-sm">IT</div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-base font-bold leading-tight truncate">IT Asset & Phone Directory</h1>
          <p class="text-[11px] text-white/50 leading-tight">ระบบจัดการอุปกรณ์และเบอร์โทรศัพท์ภายใน</p>
        </div>
      </div>
      <select id="branchSelect" class="bg-white/10 border border-white/20 text-white text-sm rounded-lg px-3 py-2 shrink-0">
        <option value="">ทุกสาขา</option>
      </select>
    </div>
    <nav class="max-w-6xl mx-auto px-2 flex gap-1 overflow-x-auto border-t border-white/10">
      <button data-tab="dashboard" class="tab-btn active whitespace-nowrap px-4 py-2.5 text-sm font-semibold border-b-2 border-transparent text-white/70">แดชบอร์ด</button>
      <button data-tab="directory" class="tab-btn whitespace-nowrap px-4 py-2.5 text-sm font-semibold border-b-2 border-transparent text-white/70">ค้นหาเบอร์โทร</button>
      <button data-tab="assets" class="tab-btn whitespace-nowrap px-4 py-2.5 text-sm font-semibold border-b-2 border-transparent text-white/70">จัดการอุปกรณ์</button>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-5">

    <!-- ================= DASHBOARD TAB ================= -->
    <section id="tab-dashboard" class="fade-in">
      <div id="summaryCards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6"></div>

      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
          <h2 class="font-bold text-sm">อุปกรณ์สำรองพร้อมใช้งาน (Spare List)</h2>
          <span id="spareCount" class="text-xs text-slate-400"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th class="text-left font-semibold px-4 py-2">ประเภท</th>
                <th class="text-left font-semibold px-4 py-2">สาขา</th>
                <th class="text-left font-semibold px-4 py-2">ตำแหน่ง</th>
                <th class="text-left font-semibold px-4 py-2">รายละเอียด</th>
              </tr>
            </thead>
            <tbody id="spareTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
          <p id="spareEmpty" class="text-center text-slate-400 text-sm py-8 hidden">ไม่มีอุปกรณ์สำรองในขณะนี้</p>
        </div>
      </div>
    </section>

    <!-- ================= DIRECTORY TAB ================= -->
    <section id="tab-directory" class="fade-in hidden">
      <div class="relative mb-4">
        <input id="directorySearch" type="text" placeholder="ค้นหาเบอร์ภายใน, สายตรง, แผนก, ตำแหน่ง..."
          class="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-3 text-sm">
        <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
      </div>
      <div id="directoryList" class="space-y-2"></div>
      <p id="directoryEmpty" class="text-center text-slate-400 text-sm py-10 hidden">ไม่พบเบอร์ที่ค้นหา</p>
    </section>

    <!-- ================= ASSETS TAB ================= -->
    <section id="tab-assets" class="fade-in hidden">
      <div class="flex items-center gap-2 overflow-x-auto pb-1 mb-4" id="assetTypeTabs"></div>

      <div class="flex items-center justify-between gap-2 mb-3">
        <input id="assetSearch" type="text" placeholder="ค้นหาในรายการนี้..."
          class="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm">
        <button id="btnAddNew" class="shrink-0 bg-teal-650 text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-teal-700 transition">+ เพิ่มรายการ</button>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm" id="assetTable">
            <thead class="bg-slate-50 text-slate-500 text-xs"><tr id="assetTableHead"></tr></thead>
            <tbody id="assetTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
        <p id="assetEmpty" class="text-center text-slate-400 text-sm py-10 hidden">ยังไม่มีข้อมูล</p>
        <p id="assetLoading" class="text-center text-slate-400 text-sm py-10">กำลังโหลดข้อมูล...</p>
      </div>
    </section>
  </main>

  <!-- ================= FORM MODAL (Add/Edit) ================= -->
  <div id="formModal" class="fixed inset-0 bg-black/50 z-40 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl max-h-[92vh] flex flex-col">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
        <h3 id="formTitle" class="font-bold text-base">เพิ่มรายการ</h3>
        <button id="formClose" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
      </div>
      <form id="itemForm" class="px-5 py-4 space-y-3 overflow-y-auto">
        <input type="hidden" id="f_id">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-slate-500">สาขา *</label>
            <select id="f_branch" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">อาคาร</label>
            <input id="f_building" list="dl_building" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            <datalist id="dl_building"></datalist>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">ชั้น</label>
            <input id="f_floor" list="dl_floor" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            <datalist id="dl_floor"></datalist>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">แผนก</label>
            <input id="f_dept" list="dl_dept" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            <datalist id="dl_dept"></datalist>
          </div>
          <div class="col-span-2">
            <label class="text-xs font-semibold text-slate-500">ตำแหน่งย่อย</label>
            <input id="f_sub" list="dl_sub" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            <datalist id="dl_sub"></datalist>
          </div>
        </div>

        <div id="dynamicFields" class="grid grid-cols-2 gap-3 pt-1 border-t border-slate-100"></div>

        <label class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="f_spare" class="w-4 h-4 rounded border-slate-300 text-teal-650">
          <span class="text-sm">เป็นอุปกรณ์สำรอง (Spare)</span>
        </label>

        <div>
          <label class="text-xs font-semibold text-slate-500">หมายเหตุ</label>
          <textarea id="f_note" rows="2" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div class="pt-2 border-t border-slate-100">
          <label class="text-xs font-semibold text-slate-500">รหัส PIN ยืนยัน *</label>
          <input id="f_pin" type="password" inputmode="numeric" maxlength="4" required
            class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm tracking-widest">
        </div>
        <p id="formError" class="text-red-600 text-xs hidden"></p>
      </form>
      <div class="px-5 py-3 border-t border-slate-200 flex items-center justify-between gap-2 shrink-0">
        <button id="btnDeleteItem" class="hidden text-red-600 text-sm font-semibold px-3 py-2 rounded-lg hover:bg-red-50">ลบรายการ</button>
        <div class="flex-1"></div>
        <button id="btnCancelForm" class="text-slate-500 text-sm font-semibold px-4 py-2 rounded-lg hover:bg-slate-100">ยกเลิก</button>
        <button id="btnSaveForm" form="itemForm" type="submit" class="bg-teal-650 text-white text-sm font-semibold px-5 py-2 rounded-lg hover:bg-teal-700">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-lg shadow-lg z-50 hidden"></div>

  <script src="app.js" defer></script>
</body>
</html>
